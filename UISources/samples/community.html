<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimeCS · 社交与任务样例</title>
<link rel="stylesheet" href="community.css">
<main class="studies">
  <figure>
    <figcaption>任务手册</figcaption>
    <div class="scene daytime">
      <section class="surface mission-screen">
        <header><div><small>任务手册</small><h2>今日任务</h2></div><span class="quiet">每日 00:00 刷新</span></header>
        <div class="line"><div><b>完成一场爆破</b><p>奖励 100 经验 · 30 代币</p></div><strong>0 / 1</strong></div>
        <div class="line"><div><b>在练枪场命中目标</b><p>奖励 60 经验 · 15 代币</p></div><strong>12 / 20</strong></div>
        <div class="line"><div><b>完成一次外观配置</b><p>奖励 50 经验 · 10 代币</p></div><span class="accent">领取奖励</span></div>
      </section>
    </div>
  </figure>
  <figure>
    <figcaption>世界频道</figcaption>
    <div class="scene">
      <section class="surface chat">
        <header><h2>世界频道</h2><span aria-hidden="true">×</span></header>
        <div class="message"><b>青柠</b><p>有人想打云上转播站吗？</p></div>
        <div class="message"><b>纱雾</b><p>我在练枪场，等我一下。</p></div>
        <div class="compose"><span class="field">输入消息</span><span class="accent">发送</span></div>
      </section>
    </div>
  </figure>
  <figure>
    <figcaption>好友弹窗</figcaption>
    <div class="scene">
      <section class="surface centered friends">
        <header><h2>好友与队伍</h2><span aria-hidden="true">×</span></header>
        <div class="compose"><span class="field">输入玩家 ID</span><span class="accent">添加</span></div>
        <div class="friend line"><img src="../assets/characters/LilyIcon.webp" alt=""><div><b>纱雾</b><p><i></i> 在线 · 大厅</p></div><span class="accent">邀请</span></div>
        <div class="friend line"><img src="../assets/characters/RoverIcon.webp" alt=""><div><b>青柠</b><p>对局中</p></div><span class="quiet">对局中</span></div>
      </section>
    </div>
  </figure>
  <figure>
    <figcaption>个人信息</figcaption>
    <div class="scene">
      <section class="surface centered identity">
        <header><h2>编辑个人资料</h2><span aria-hidden="true">×</span></header>
        <div class="profile-row"><img src="../assets/characters/NoraIcon.webp" alt=""><div><b>晴野</b><p>LV. 01 · AnimeCS</p></div><span class="quiet">更换头像</span></div>
        <div class="edit-field"><b>个人签名</b><span class="field">今天也来打一场。</span></div>
        <footer><span class="quiet">取消</span><span class="accent">保存</span></footer>
      </section>
    </div>
  </figure>
</main>
</html>
